<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BankLite | Server Error</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="favicon.ico?v=1" rel="icon" type="image/x-icon" />
  </head>
  <body class="auth-page">
    <main>
      <div class="static-page-card static-page-card--small">
        <div class="logo">
          <svg
            fill="none"
            height="30"
            stroke="#1a3a5c"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.75"
            viewBox="0 0 24 24"
            width="30"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect height="14" rx="3" width="20" x="2" y="5" />
            <line x1="2" x2="22" y1="10" y2="10" />
            <line x1="6" x2="10" y1="15" y2="15" />
            <circle cx="17" cy="15" fill="#1a3a5c" r="1.5" />
          </svg>
        </div>
        <h1 class="static-error-code static-error-code--red">500</h1>
        <h2 class="static-error-title" data-i18n="server_error_title">
          Something Went Wrong
        </h2>
        <p data-i18n="server_error_text">
          Something unexpected happened. Please try again or return to the
          dashboard.
        </p>
        <div class="static-page-back">
          <a
            class="empty-state-btn"
            data-i18n="go_to_dashboard"
            href="dashboard.html"
            >Go to Dashboard</a
          >
        </div>
      </div>
    </main>
    <script src="js/i18n.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="BankLite | Reset your password" name="description" />
    <meta content="noindex" name="robots" />
    <title>BankLite | Reset Password</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="favicon.ico?v=1" rel="icon" type="image/x-icon" />
  </head>
  <body class="auth-page">
    <div class="lang-toggle-wrap">
      <button
        aria-label="Change language"
        class="lang-toggle-btn"
        id="lang-toggle-btn"
      >
        <span id="lang-flag"></span>
        <span id="lang-label"></span>
      </button>
    </div>
    <main>
      <form id="reset-form" novalidate>
        <div class="logo">
          <svg
            aria-hidden="true"
            fill="none"
            focusable="false"
            height="30"
            stroke="#1a3a5c"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.75"
            viewBox="0 0 24 24"
            width="30"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect height="14" rx="3" width="20" x="2" y="5" />
            <line x1="2" x2="22" y1="10" y2="10" />
            <line x1="6" x2="10" y1="15" y2="15" />
            <circle cx="17" cy="15" fill="#1a3a5c" r="1.5" />
          </svg>
        </div>
        <h1>BankLite</h1>
        <p data-i18n="reset_subtitle">Enter your new password</p>
        <div
          aria-live="polite"
          class="error-msg"
          id="error-msg"
          role="alert"
        ></div>
        <div
          aria-live="polite"
          class="success-msg"
          id="success-msg"
          role="status"
        ></div>
        <label data-i18n="reset_new_password" for="new-password"
          >New Password</label
        >
        <div class="input-wrap">
          <svg
            aria-hidden="true"
            class="input-icon"
            fill="none"
            focusable="false"
            height="16"
            stroke="#9ca3af"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect height="11" rx="2" ry="2" width="18" x="3" y="11" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            autocomplete="new-password"
            id="new-password"
            placeholder="••••••••"
            required
            type="password"
          />
          <button
            aria-label="Toggle password visibility"
            class="toggle-password"
            id="toggle-new-password"
            type="button"
          >
            <svg
              fill="none"
              height="16"
              id="eye-icon-new"
              stroke="#9ca3af"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="16"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <label data-i18n="reset_confirm_password" for="confirm-password"
          >Confirm Password</label
        >
        <div class="input-wrap">
          <svg
            aria-hidden="true"
            class="input-icon"
            fill="none"
            focusable="false"
            height="16"
            stroke="#9ca3af"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect height="11" rx="2" ry="2" width="18" x="3" y="11" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            autocomplete="new-password"
            id="confirm-password"
            placeholder="••••••••"
            required
            type="password"
          />
          <button
            aria-label="Toggle password visibility"
            class="toggle-password"
            id="toggle-confirm-password"
            type="button"
          >
            <svg
              fill="none"
              height="16"
              id="eye-icon-confirm-reset"
              stroke="#9ca3af"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              viewBox="0 0 24 24"
              width="16"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <button data-i18n="reset_btn" id="reset-btn" type="submit">
          Reset Password
        </button>
        <p class="auth-footer">
          <a class="link-accent" data-i18n="reset_back" href="index.html"
            >Back to Sign In</a
          >
        </p>
      </form>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>

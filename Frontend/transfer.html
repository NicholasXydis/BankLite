<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BankLite transfer page | Securely move funds between your accounts with ease."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="BankLite | Transfer" />
    <meta
      property="og:description"
      content="A modern personal banking app to manage your accounts, deposits, withdrawals and transfers."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://bankliteapi-accpeqhrcybqe9gy.canadacentral-01.azurewebsizes.net"
    />
    <meta name="theme-color" content="#1a3a5c" />
    <title>BankLite | Transfer</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="xfavicon.ico" type="image/x-icon" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="5" width="20" height="14" rx="3" />
            <line x1="2" y1="10" x2="22" y2="10" />
            <line x1="6" y1="15" x2="10" y2="15" />
            <circle cx="17" cy="15" r="1.5" fill="#fff" />
          </svg>
          <span>BankLite</span>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
            Dashboard
          </a>
          <a href="deposit.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="19" x2="12" y2="5" />
              <polyline points="5 12 12 5 19 12" />
            </svg>
            Deposit
          </a>
          <a href="withdraw.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <polyline points="19 12 12 19 5 12" />
            </svg>
            Withdraw
          </a>
          <a href="transfer.html" class="active">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="17 1 21 5 17 9" />
              <path d="M3 11V9a4 4 0 0 1 4-4h14" />
              <polyline points="7 23 3 19 7 15" />
              <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
            Transfer
          </a>
          <a href="transactions.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
            Transactions
          </a>
        </nav>
        <button id="logout-btn">Logout</button>
      </aside>
      <main class="dashboard-main">
        <h1 class="dashboard-title">Transfer Funds</h1>
        <div id="empty-state" class="empty-state" style="display: none">
          <div class="empty-state-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="36"
              height="36"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#1a3a5c"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="5" width="20" height="14" rx="3" />
              <line x1="2" y1="10" x2="22" y2="10" />
              <line x1="6" y1="15" x2="10" y2="15" />
              <circle cx="17" cy="15" r="1.5" fill="#1a3a5c" />
            </svg>
          </div>
          <h3 class="empty-state-title">Your financial journey starts here</h3>
          <p class="empty-state-text">Create your first account</p>
          <a href="dashboard.html" class="empty-state-btn">Create Account</a>
        </div>
        <div class="form-card" style="display: none">
          <div
            id="error-msg"
            class="error-msg"
            role="alert"
            aria-live="polite"
          ></div>
          <div
            id="success-msg"
            class="success-msg"
            role="status"
            aria-live="polite"
          ></div>
          <div class="form-group">
            <label for="account-select">From Account</label>
            <select id="account-select">
              <option value="">Loading accounts...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="to-account-select">To Account</label>
            <select id="to-account-select">
              <option value="">Select account...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="text"
              id="amount"
              class="no-icon-input"
              placeholder="$0.00"
              inputmode="decimal"
            />
          </div>
          <button id="transfer-btn">Transfer</button>
        </div>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/transfer.js"></script>

    <div id="session-warning" style="display: none">
      <span id="session-countdown"></span>
      <button id="session-stay-btn">Stay Logged In</button>
    </div>

    <div id="logout-modal" class="modal-overlay" style="display: none">
      <div class="modal">
        <h3 class="modal-title">Log Out</h3>
        <p class="modal-text">Are you sure you want to log out?</p>
        <div class="modal-actions">
          <button id="modal-cancel-btn" class="modal-cancel">Cancel</button>
          <button id="modal-confirm-btn" class="modal-confirm">Log Out</button>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BankLite | Reset your password" />
    <meta name="robots" content="noindex" />
    <title>BankLite | Reset Password</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="xFavicon.ico" type="image/x-icon" />
  </head>
  <body class="auth-page">
    <main>
      <form id="reset-form" novalidate>
        <div class="logo">
          <svg
            aria-hidden="true"
            focusable="false"
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1a3a5c"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="5" width="20" height="14" rx="3" />
            <line x1="2" y1="10" x2="22" y2="10" />
            <line x1="6" y1="15" x2="10" y2="15" />
            <circle cx="17" cy="15" r="1.5" fill="#1a3a5c" />
          </svg>
        </div>
        <h1>BankLite</h1>
        <p>Enter your new password</p>
        <div
          id="error-msg"
          class="error-msg"
          role="alert"
          aria-live="polite"
        ></div>
        <div
          id="success-msg"
          class="success-msg"
          role="status"
          aria-live="polite"
        ></div>
        <label for="new-password">New Password</label>
        <div class="input-wrap">
          <svg
            aria-hidden="true"
            focusable="false"
            class="input-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9ca3af"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            type="password"
            id="new-password"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-password"
            id="toggle-new-password"
            aria-label="Toggle password visibility"
          >
            <svg
              id="eye-icon-new"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#9ca3af"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <svg
            aria-hidden="true"
            focusable="false"
            class="input-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9ca3af"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            type="password"
            id="confirm-password"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="toggle-password"
            id="toggle-confirm-password"
            aria-label="Toggle password visibility"
          >
            <svg
              id="eye-icon-confirm-reset"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#9ca3af"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <button type="submit" id="reset-btn">Reset Password</button>
        <p class="auth-footer">
          <a class="link-accent" href="index.html">Back to Sign In</a>
        </p>
      </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BankLite secure online banking | Manage your accounts, deposits, withdrawals and transfers."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="BankLite | Login" />
    <meta
      property="og:description"
      content="A modern personal banking app to manage your accounts, deposits, withdrawals and transfers."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1a3a5c" />
    <title>BankLite | Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="xFavicon.ico" type="image/x-icon" />
  </head>
  <body class="auth-page">
    <main>
      <form id="login-form" novalidate>
        <div class="logo">
          <svg
            aria-hidden="true"
            focusable="false"
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1a3a5c"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="5" width="20" height="14" rx="3" />
            <line x1="2" y1="10" x2="22" y2="10" />
            <line x1="6" y1="15" x2="10" y2="15" />
            <circle cx="17" cy="15" r="1.5" fill="#1a3a5c" />
          </svg>
        </div>
        <h1>BankLite</h1>
        <p data-i18n="login_subtitle">Sign in to your account</p>
        <div
          id="error-msg"
          class="error-msg"
          role="alert"
          aria-live="polite"
        ></div>
        <label for="email" data-i18n="login_email">Email</label>

        <div class="input-wrap">
          <svg
            aria-hidden="true"
            focusable="false"
            class="input-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9ca3af"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="you@example.com"
            data-i18n="placeholder_email"
            data-i18n-attr="placeholder"
            required
            autocomplete="email"
          />
        </div>

        <label for="password" data-i18n="login_password">Password</label>

        <div class="input-wrap">
          <svg
            aria-hidden="true"
            focusable="false"
            class="input-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#9ca3af"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />

          <button
            type="button"
            class="toggle-password"
            id="toggle-password"
            aria-label="Toggle password visibility"
          >
            <svg
              id="eye-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#6b7280"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>

        <div class="forgot-password">
          <a
            href="#"
            class="link-accent"
            style="font-size: 0.8rem"
            id="forgot-password-link"
            data-i18n="login_forgot"
            >Forgot password?</a
          >
        </div>
        <button type="submit" id="login-btn" data-i18n="login_btn">
          Sign in
        </button>
        <p class="auth-footer">
          <span class="muted" data-i18n="login_no_account"
            >Don't have an account?</span
          >
          <a class="link-accent" href="register.html" data-i18n="login_register"
            >Register</a
          >
        </p>
      </form>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <div
      id="forgot-modal"
      class="modal-overlay"
      style="display: none; padding-left: 0"
    >
      <div class="modal">
        <h3 class="modal-title" data-i18n="forgot_title">Reset Password</h3>
        <p class="modal-text" data-i18n="forgot_text">
          Enter your email, we'll send you a reset link. Valid for 15 minutes.
        </p>
        <div
          id="forgot-error"
          class="error-msg"
          role="alert"
          aria-live="polite"
        ></div>
        <div
          id="forgot-success"
          class="success-msg"
          role="status"
          aria-live="polite"
          style="display: none"
        ></div>
        <div style="margin: 0.75rem 0">
          <input
            type="email"
            id="forgot-email"
            class="no-icon-input"
            placeholder="you@example.com"
            data-i18n="placeholder_email"
            data-i18n-attr="placeholder"
            autocomplete="email"
            style="width: 100%; text-align: left"
          />
        </div>
        <div class="modal-actions" style="display: flex; gap: 1rem">
          <button
            id="forgot-cancel-btn"
            class="modal-cancel"
            style="flex: 1"
            data-i18n="forgot_cancel"
          >
            Cancel
          </button>
          <button
            id="forgot-submit-btn"
            style="flex: 1"
            data-i18n="forgot_submit"
          >
            Send Reset Link
          </button>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="BankLite - A full-stack banking app built with C#, .NET 8, PostgreSQL, JavaScript, Docker, and CI/CD."
      data-i18n="landing_meta_description"
      data-i18n-attr="content"
      name="description"
    />
    <meta content="index, follow" name="robots" />
    <meta
      content="BankLite | Landing"
      data-i18n="landing_og_title"
      data-i18n-attr="content"
      property="og:title"
    />
    <meta
      content="A polished full-stack banking app with secure auth, real-time features, and bilingual support."
      data-i18n="landing_og_description"
      data-i18n-attr="content"
      property="og:description"
    />
    <meta content="website" property="og:type" />
    <meta content="#1a3a5c" name="theme-color" />
    <title data-i18n="landing_page_title">
      BankLite | Full-Stack Banking App
    </title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/landing.css" rel="stylesheet" />
    <link href="favicon.ico?v=1" rel="icon" type="image/x-icon" />
  </head>
  <body class="lp-page">
    <button
      aria-label="Change language"
      data-i18n="landing_change_language"
      data-i18n-attr="aria-label"
      id="lp-lang-btn"
      type="button"
    >
      <span id="lp-flag"></span>
      <span id="lp-lang-label"></span>
    </button>

    <div aria-hidden="true" class="lp-scene"></div>
    <div aria-hidden="true" class="lp-grid"></div>

    <main class="lp-shell">
      <section aria-labelledby="lp-title" class="lp-hero">
        <div class="lp-copy">
          <h1 id="lp-title">BankLite</h1>
          <div class="lp-actions">
            <button class="lp-btn-signin" id="lp-demo-btn" type="button">
              <span data-i18n="landing_sign_in">Sign in</span>
            </button>
            <a
              class="lp-btn-secondary"
              href="https://github.com/NicholasXydis/BankLiteAPI"
              rel="noopener noreferrer"
              target="_blank"
              >GitHub</a
            >
          </div>
          <div class="lp-stack-wrap">
            <div
              aria-label="Technology stack"
              class="lp-stack"
              data-i18n="landing_stack_aria"
              data-i18n-attr="aria-label"
            >
              <span data-depth="18">C#</span>
              <span data-depth="28">.NET</span>
              <span data-depth="20">EF Core</span>
              <span data-depth="32">PostgreSQL</span>
              <span data-depth="24">JWT Auth</span>
              <span data-depth="36">JavaScript</span>
              <span data-depth="22">Docker</span>
              <span data-depth="30">CI/CD</span>
            </div>
          </div>
        </div>

        <div aria-hidden="true" class="lp-showcase">
          <div class="lp-card-scene">
            <div class="lp-credit-card">
              <div class="lp-card-sheen"></div>
              <div class="lp-card-top">
                <span>BankLite</span>
              </div>
              <div class="lp-card-chip"></div>
              <div class="lp-card-number">•••• •••• •••• 2026</div>
              <div class="lp-card-bottom">
                <span>Nicholas Xydis</span>
                <svg
                  fill="none"
                  height="20"
                  stroke="#fff"
                  stroke-linecap="round"
                  stroke-width="1.5"
                  viewBox="0 0 32 20"
                  width="32"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path d="M2 10c3-6 5-6 8 0s5 6 8 0 5-6 8 0" />
                  <path d="M2 15c3-6 5-6 8 0s5 6 8 0 5-6 8 0" opacity="0.5" />
                </svg>
              </div>
            </div>
            <div class="lp-card-shadow"></div>
          </div>
        </div>
      </section>
    </main>

    <script
      crossorigin="anonymous"
      integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu"
      src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    ></script>
    <script
      crossorigin="anonymous"
      integrity="sha384-L0sjdcIWJ156WmvbxIBHx79j1WrCqANCyw456nl/aPWSYiHNywEU2VIAcbSJeIiX"
      src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"
    ></script>
    <script
      crossorigin="anonymous"
      integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt"
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script src="js/i18n.js"></script>
    <script defer src="js/landing.js"></script>
  </body>
</html>

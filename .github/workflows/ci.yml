name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend lint dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend JavaScript
        working-directory: frontend
        run: npm run lint

  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate production Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Validate production connection strings
        run: |
          set -euo pipefail
          config="$(docker compose --env-file .env.example --profile tools config)"
          printf '%s\n' "${config}" | grep -F "Host=db;Port=5432;Database=banklite;Username=bank_app;Password=replace_with_a_unique_app_password"
          printf '%s\n' "${config}" | grep -F "Host=db;Port=5432;Database=banklite;Username=banklite_admin;Password=replace_with_a_unique_admin_password"

      - name: Validate E2E Compose
        run: docker compose --file docker-compose.e2e.yml config --quiet

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=banklite;Username=postgres;Password=banklite_test_postgres_password
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: banklite
          POSTGRES_PASSWORD: banklite_test_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname banklite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/BankLite.Tests/BankLite.Tests.csproj

      - name: Check backend formatting
        run: dotnet format backend/BankLite.Tests/BankLite.Tests.csproj --verify-no-changes --no-restore

      - name: Run backend tests
        run: dotnet test backend/BankLite.Tests/BankLite.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory backend/TestResults

      - name: Upload backend test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: error
          retention-days: 14

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_FRONTEND_URL: http://127.0.0.1:5500
      E2E_API_URL: http://127.0.0.1:5028
      E2E_DATABASE_URL: postgresql://banklite_admin:banklite_e2e_admin_password@127.0.0.1:5433/banklite_e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tests/package-lock.json

      - name: Install Playwright dependencies
        working-directory: frontend/tests
        run: npm ci

      - name: Install Chromium
        working-directory: frontend/tests
        run: npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose --file docker-compose.e2e.yml up --build --detach --wait

      - name: Show E2E stack state
        run: docker compose --file docker-compose.e2e.yml ps

      - name: Run Playwright tests
        working-directory: frontend/tests
        run: npm test

      - name: Capture E2E logs
        if: ${{ failure() }}
        run: docker compose --file docker-compose.e2e.yml logs --no-color > e2e-docker.log

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-artifacts
          path: |
            e2e-docker.log
            frontend/tests/test-results
            frontend/tests/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Stop E2E stack
        if: ${{ always() }}
        run: docker compose --file docker-compose.e2e.yml down --volumes --remove-orphans
